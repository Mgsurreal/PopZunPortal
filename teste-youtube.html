<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Teste YouTube</title>
  <style>
    body {
      margin: 40px;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
    }

    .video-embed {
      width: 100%;
      max-width: 800px;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .video-embed iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <h1>Teste de vídeo incorporado</h1>

  <div class="video-embed">
<iframe width="560" height="315" src="https://www.youtube.com/embed/-6mC48TR3m4?si=boLsyrQvV1Fd-a2b" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  </div>
</body>
</html>
